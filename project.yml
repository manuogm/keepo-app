name: Keepo

options:
  bundleIdPrefix: com.manuogm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  KeepoCore:
    path: Packages/KeepoCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  Keepo:
    type: application
    platform: iOS
    sources:
      # The vendored third-party licences ship as a *folder reference* so the
      # directory structure survives into the bundle. Copied as ordinary
      # resources they would be flattened to the bundle root, where a second
      # dependency's LICENSE.md would silently collide with the first.
      - path: App
        excludes:
          - "Resources/ThirdPartyLicenses/**"
          - "Resources/Videos/**"
      - path: App/Resources/ThirdPartyLicenses
        type: folder
      # The Shortcuts walkthrough clips, same folder-reference treatment and
      # for a plainer reason: dropping a newly recorded clip in should not
      # also require setting its target membership. The folder is referenced
      # while still empty on purpose — `ShortcutsWalkthrough` names clips
      # that may not exist yet and the walkthrough falls back to its text,
      # so the flow builds against nothing here.
      - path: App/Resources/Videos
        type: folder
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KeepoCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manuogm.keepo
        PRODUCT_NAME: Keepo
        # Lives here, not in the generated .xcodeproj. Xcode writes the team
        # into the project file when you pick it in the Signing pane, and the
        # next `xcodegen generate` throws it away again — signing then breaks
        # on the next device build with no obvious cause. project.yml is the
        # only place a setting survives regeneration.
        DEVELOPMENT_TEAM: K46X3FA9HH
        GENERATE_INFOPLIST_FILE: YES
        # NOT `INFOPLIST_KEY_UILaunchScreen_Generation` any more, and none
        # of its siblings: `UILaunchScreen` is a **dictionary**, which the
        # INFOPLIST_KEY_* mechanism cannot express — setting
        # `..._BackgroundColor` and `..._UIImageName` alongside it builds an
        # *empty* `UILaunchScreen` dict and a blank white launch screen,
        # verified in the built Info.plist. It lives in App/Info.plist
        # instead, for the same reason `NSBonjourServices` (an array) does.
        INFOPLIST_KEY_CFBundleDisplayName: Keepo
        # There is deliberately no NSPhotoLibraryUsageDescription: the
        # library goes through `PhotosPicker`, which runs out of process —
        # the user picking a photo IS the grant, so the app never gets, or
        # needs, library access.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Keepo uses the camera to take your profile photo, and to scan a
          household QR code when two phones cannot find each other over
          Bluetooth. Nothing is recorded or uploaded.
        # MultipeerConnectivity — the household pairing ceremony
        # (`HouseholdPairingSession`). iOS 14 onward gates peer discovery
        # behind the local-network prompt, and the failure mode without these
        # two keys is NOT an error: the browser starts, finds nothing, and the
        # discovery screen searches forever. NSBonjourServices must list both
        # transports and must match `HouseholdPairingSession.serviceType`
        # exactly — a mismatched string fails exactly as silently.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Keepo looks for the other phone on your local network so the two of
          you can build a household while standing next to each other. It
          finds Keepo devices only, and only while that screen is open.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          Keepo uses Bluetooth to find the other phone when you build a
          household together, so the two devices have to be close to each
          other.
        # StepUpAuthenticator's LAContext.evaluatePolicy — the biometric
        # re-check before export, account deletion and leaving/erasing a
        # household — is a hard crash without this key on a real device.
        # StubAuthProvider (the local-dev-stack auth path, `SessionStore
        # .isLocal`) never calls it, so nothing in the Simulator, where every
        # session in this build has run so far, ever exercised the real
        # LAContext call that needs it.
        INFOPLIST_KEY_NSFaceIDUsageDescription: >-
          Keepo asks for Face ID right before a sensitive action — leaving or
          erasing a household, exporting your data, or deleting your account
          — to confirm it's really you.
        # App/Info.plist is a partial plist merged into the auto-generated
        # one — INFOPLIST_KEY_* only recognizes well-known Apple keys, so
        # arbitrary custom keys (SupabaseURL/SupabaseAnonKey) go here instead,
        # $(VAR)-substituted from the xcconfig-injected build settings during
        # Process Info.plist. See Config/Debug.xcconfig.example.
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Keepo.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  KeepoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeepoTests
    dependencies:
      - target: Keepo
      - package: GRDB
        product: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  KeepoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeepoUITests
    dependencies:
      - target: Keepo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Keepo

schemes:
  Keepo:
    build:
      targets:
        Keepo: all
        KeepoTests: [test]
        KeepoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeepoTests
        - KeepoUITests
    archive:
      config: Release
