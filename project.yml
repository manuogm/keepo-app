name: Keepo

options:
  bundleIdPrefix: com.manuogm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  KeepoCore:
    path: Packages/KeepoCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  Keepo:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KeepoCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manuogm.keepo
        PRODUCT_NAME: Keepo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keepo
        # App/Info.plist is a partial plist merged into the auto-generated
        # one — INFOPLIST_KEY_* only recognizes well-known Apple keys, so
        # arbitrary custom keys (SupabaseURL/SupabaseAnonKey) go here instead,
        # $(VAR)-substituted from the xcconfig-injected build settings during
        # Process Info.plist. See Config/Debug.xcconfig.example.
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Keepo.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  KeepoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeepoTests
    dependencies:
      - target: Keepo
      - package: GRDB
        product: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  KeepoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeepoUITests
    dependencies:
      - target: Keepo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Keepo

schemes:
  Keepo:
    build:
      targets:
        Keepo: all
        KeepoTests: [test]
        KeepoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeepoTests
        - KeepoUITests
    archive:
      config: Release
